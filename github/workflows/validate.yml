name: Validate LinSpectacles Modules sources

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Check manifests, source syntax, packaging and portable ZIPs
        run: python3 tools/validate_repository.py
      - name: Prepare individual RPM sources without rpmbuild
        run: |
          for module in modules/*; do
            bash "$module/packaging/rpm/build-rpm.sh" --prepare-only
          done
      - name: Prepare metapackage sources without rpmbuild
        run: bash metapackage/build-rpm-fedora.sh --prepare-only
